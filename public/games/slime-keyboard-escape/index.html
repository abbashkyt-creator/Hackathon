<!DOCTYPE html>
<html lang='en'> <head> <meta charset='utf-8' /> <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'> <meta name='mobile-web-app-capable' content='yes'> <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'> <meta name='format-detection' content='telephone=no, address=no, email=no'> <meta name='google' content='notranslate'> <meta name='theme-color' content='#000000'> <meta name='color-scheme' content='dark'> <link rel='icon' type='image/svg+xml' href='favicon.svg'> <link rel='stylesheet' href='fonts/inter/inter.css'> <link rel='stylesheet' href='client.css'> <title>Slime Keyboard Escape</title>
</head> <body> <div id='game-root'> <!-- Initial loading screen --> <div id='loading-screen'> <img src='textures/menu/GameLogoMini.jpg' alt='Game logo' data-i18n-alt='loading.logoAlt' class='loading-logo'> <div class='game-title' data-i18n='loading.title'>SLIME KEYBOARD ESCAPE</div> <div class='loading-bar-track'> <div class='loading-bar-fill'></div> </div> <div class='loading-text' data-i18n='loading.text'>LOADING</div> </div> <!-- Map-switch loading screen — stays mounted, toggled via `.hidden` by gameUI.showMapLoadingScreen/hideMapLoadingScreen during world hops (friend-room joins), so the scene teardown is never visible. --> <div id='map-loading-screen' class='hidden'> <img src='textures/menu/GameLogoMini.jpg' alt='Game logo' data-i18n-alt='loading.logoAlt' class='loading-logo'> <div class='loading-title' data-i18n='loading.title'>SLIME KEYBOARD ESCAPE</div> <div class='loading-bar-track'> <div class='loading-bar-fill'></div> </div> </div> <!-- Game --> <div id='game'> <!-- HUD root. Contains every in-game element (touch controls, picker menu, popups). --> <div id='hud-ui'> <!-- Top-left HUD: picker menu contains Options and the GOD_MODE-only Debug control. Ranking and Chat sit top-right. --> <div class="hud-topleft"> <!-- Picker menu with the presence pill ("N players here") sitting directly below it, both sharing one column so the pill matches the menu's width. --> <div class="hud-menu-col"> <picker-menu></picker-menu> <presence-pill></presence-pill> </div> </div> <!-- Leaderboard popup (Today / Week tabs, top-3 in 3D). Hidden until picker-menu's Ranking action dispatches leaderboard:open. --> <leaderboard-popup></leaderboard-popup> <!-- Moderated room chat. The popup is opened from picker-menu (or Enter on desktop); the feed shows recent signed messages. --> <chat-popup></chat-popup> <chat-feed></chat-feed> <!-- Shop popup (Trails/Auras/Skins + live 3D preview). Opened by the left-side hud-button-stack's Shop icon dispatching game-open-shop. --> <shop-popup></shop-popup> <!-- Rebirth popup + full-screen celebration. Opened by the left-side hud-button-stack's Rebirth icon dispatching pok-open-rebirth. --> <rebirth-popup></rebirth-popup> <!-- World-unlock confirm popup — opened by walking into a locked world portal (scene/worldPortals.ts dispatching pok-open-world-portal). Buys with Wins, then travels. --> <world-portal-popup></world-portal-popup> <!-- Champion-reward popup. Shown after spawn when the login payload carries pendingRewards; previewable via ?reward=daily|weekly. --> <reward-popup></reward-popup> <!-- Profile popup (stats + rename). Opened by the local-player nametag's pencil icon dispatching profile:open. --> <profile-popup></profile-popup> <!-- Options popup. Opened by the picker-menu Options row dispatching options:open. --> <options-popup></options-popup> <!-- GOD_MODE stage-teleport popup. Opened by the picker-menu Debug row (only rendered when ClientGlobals.GOD_MODE) dispatching debug:open. --> <debug-popup></debug-popup> <!-- HUD. All Lit custom elements; GameUI pushes state via reactive properties. See src/client/ui/components/. --> <div class="world-region-hud"> <region-selector></region-selector> <world-name-label></world-name-label> </div> <wins-counter></wins-counter> <controls-legend></controls-legend> <!-- Left-edge icon stack: Rebirth + Shop (Milestone E screen grammar). Fixed-positioned via its own CSS, mid-height. --> <hud-button-stack></hud-button-stack> <!-- Big bottom-center speed counter + level progress bar (Milestone A). Fixed-positioned via its own CSS. --> <speed-counter></speed-counter> <!-- Top-center LEVEL UP banner — pops on speedStats.bankStep's pok-level-up event with the old → new run speed. --> <level-up-banner></level-up-banner> <!-- Shown on death: free Restart plus rewarded-ad stage revive / skip. The server resolves every destination and record penalty. --> <death-panel></death-panel> <!-- Touch HUD region. GameUI flips display:block/none on this wrapper based on IS_TOUCH_DEVICE. --> <div id='touch-controls' class='touch-controls'> <character-controls></character-controls> <!-- Right-half capture region for the touch look joystick. Invisible (nipplejs dataOnly:true) — just a hit-target for drag-to-rotate. Always on while #touch-controls is visible. --> <div id='nipple-look-zone'></div> </div> </div> </div>
</div> </body>
