<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Theft City</title>
    <link rel="icon" href="data:," />
    <script src="/games/_shared/network-lock.js"></script>
    <link rel="stylesheet" href="./tiptap-shell.css" />
    <script src="./tiptap-platform-bridge.js"></script>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" tabindex="0" aria-label="Theft City game"></canvas>
      <section id="loading" aria-live="polite">
        <strong>THEFT CITY</strong>
        <div class="track"><span id="progress"></span></div>
        <small id="status">Loading city…</small>
      </section>
      <section id="error" hidden>
        <strong>Could not start Theft City</strong>
        <button id="retry" type="button">Retry</button>
      </section>
    </main>
    <script src="./tiptap-bootstrap.js"></script>
  </body>
</html>
