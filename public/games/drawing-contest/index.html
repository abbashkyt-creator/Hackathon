<script type="module">
    export default class LoaderView extends HTMLElement {
        constructor() {
            super();
            this.zoomEnabled = false
            this.updateDimensions = this.updateDimensions.bind(this);
        }

        connectedCallback() {
            this.style.display = 'block';
            this.style.position = 'absolute';
            this.updateDimensions();
            window.addEventListener('resize', this.updateDimensions.bind(this));
        }


        updateDimensions() {
            this.cleanStyles();
            const width = this.getAttribute('width') || '980px';
            const height = this.getAttribute('height') || '2122px';
            const size = this.getAttribute("size") || "contain";
            const allowVerticalGrow = this.getAttribute("allow-vertical-grow") === "true";
            const allowHorizontalGrow = this.getAttribute("allow-horizontal-grow") === "true";
            if (allowVerticalGrow) {
                this.style.minHeight = height;
                this.style.maxHeight = "calc(100vh / var(--scaled-view-browser-scale))";
            } else {
                this.style.height = height;
            }

            if (allowHorizontalGrow) {
                this.style.minWidth = width;
                this.style.maxWidth = "calc(100vw / var(--scaled-view-browser-scale))";
            } else {
                this.style.width = width;
            }


            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const elementWidth = parseFloat(width);
            const elementHeight = parseFloat(height);
            const scaleWidth = containerWidth / elementWidth;
            const scaleHeight = containerHeight / elementHeight;
            let scale = 1;
            if (size === "contain") {
                scale = Math.min(scaleWidth, scaleHeight);
            } else if (size === "cover") {
                scale = Math.max(scaleWidth, scaleHeight);
            }

            if (scaleWidth < scaleHeight) {
                size == "contain" ? this.applyVerticalAlignment() : this.applyHorizontalAlignment();
            } else {
                size == "contain" ? this.applyHorizontalAlignment() : this.applyVerticalAlignment()
            }

            if (this.zoomEnabled) {
                this.style.zoom = scale; // Usar zoom para escalar el contenido
            } else {
                this.style.transform = `${this.style.transform} scale(${scale})`;
            }
            this.style.setProperty('--scaled-view-browser-scale', scale);
            this.style.setProperty('--scaled-view-scale', scale);
        }

        cleanStyles() {
            this.style.left = '0';
            this.style.right = '';
            this.style.transform = "";
            this.style.transformOrigin = "";
            this.style.top = '0';
            this.style.bottom = '';
        }

        disconnectedCallback() {

        }

        static get observedAttributes() {
            return ['width', 'height', 'vertical-align', "horizontal-align"]; // Observar cambios en estos atributos
        }

        attributeChangedCallback(name, oldValue, newValue) {
            if (name === 'width' || name === 'height' || name === 'vertical-align' || name === 'horizontal-align') {
                this.updateDimensions();
            }
        }


        applyVerticalAlignment() {
            // this.classList.add("vertical")
            const alignment = this.getAttribute('vertical-align') || 'center';
            switch (alignment) {
                case 'top':
                    // this.classList.add("top")
                    this.style.top = '0';
                    this.style.bottom = '';
                    this.style.left = '50%';
                    this.style.transform = this.zoomEnabled ? 'translateY(0%) translateX(calc(-50%) ' : 'translateY(0%) translateX(calc(-50% * var(--scaled-view-browser-scale))) ';
                    this.style.transformOrigin = 'top left';
                    break;
                case 'bottom':
                    // this.classList.add("bottom")
                    this.style.top = '';
                    this.style.bottom = '0';
                    this.style.left = '50%';
                    this.style.transform = this.zoomEnabled ? 'translateY(0%) translateX(calc(-50%) ' : 'translateY(0%) translateX(calc(-50% * var(--scaled-view-browser-scale))) ';
                    this.style.transformOrigin = 'bottom left';
                    break;
                case 'center':
                    // this.classList.add("center")
                    this.style.top = '50%';
                    this.style.bottom = '';
                    this.style.left = '50%';
                    this.style.transform = this.zoomEnabled ? 'translateY(-50%) translateX(-50%) ' : 'translateY(-50%) translateX(calc(-50% * var(--scaled-view-browser-scale))) ';
                    this.style.transformOrigin = 'center left';
                    break;
            }
        }

        applyHorizontalAlignment() {
            const alignment = this.getAttribute('horizontal-align') || 'center';
            switch (alignment) {
                case 'left':
                    this.style.left = '0';
                    this.style.right = '';
                    this.style.transform = 'translateX(0%)';
                    this.style.transformOrigin = 'top left';
                    break;
                case 'right':
                    this.style.left = '';
                    this.style.right = '0';
                    this.style.transform = 'translateX(0%)';
                    this.style.transformOrigin = 'top right';
                    break;
                case 'center':
                    this.style.left = '50%';
                    this.style.right = '';
                    this.style.transform = 'translateX(-50%)';
                    this.style.transformOrigin = 'top center';
                    break;
            }
        }

    }


    customElements.define('loader-view', LoaderView);

</script>

<style>
    body {
        background-color: #DF9465;
    }

    .game-loader {
        display: none;

    }

    .loading-game .game-loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        background-color: #DF9465;
        z-index: 9999;
        background-image: url(./assets/background.jpeg);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center center;
    }

    .loading-game .game-loader svg {
        width: 910px;
        height: 910px;
        left: 90px;
        position: absolute;
        top: 470px;
    }

    .progress-container {
        width: 770px;
        height: 28px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        position: absolute;
        top: 1430px;
        left: 50%;
        transform: translateX(-50%);
    }

    .progress-segment {
        position: absolute;
        height: 100%;
        width: 80px;
        background-color: #FFD12B;
        border-radius: 20px;
        animation: slide 2s ease-in-out infinite;
    }

    @keyframes slide {
        0% {
            left: -80px;
        }
        50% {
            left: calc(100% - 0px);
        }
        100% {
            left: -80px;
        }
    }
</style>

<script>
    // Promesa global para esperar a que el CSS esté aplicado
    window.whenStylesReady = new Promise((resolve) => {
        function cssVarReady() {
            const v = getComputedStyle(document.documentElement)
                .getPropertyValue('--app-styles-ready')
                .trim();
            return v === '1';
        }

        // Cargamos el CSS
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'styles.css';

        // Camino principal: cuando el CSS carga, se resuelve
        l.onload = () => resolve();

        // Backup: si el onload no dispara, usamos polling sobre la var CSS
        const startPoll = () => {
            if (cssVarReady()) {
                resolve();
            } else {
                const h = setInterval(() => {
                    if (cssVarReady()) {
                        clearInterval(h);
                        resolve();
                    }
                }, 50);
            }
        };

        // Insertamos el link
        document.head.appendChild(l);

        // Arrancamos el backup en el siguiente frame
        requestAnimationFrame(startPoll);
    });
</script>
