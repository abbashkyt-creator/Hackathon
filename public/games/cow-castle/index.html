<!doctype html>
<html lang="en"> <head> <meta charset="utf-8"> <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no"> <meta name="apple-mobile-web-app-capable" content="yes"> <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags --> <title>Cow Castle 1.4</title> <style type="text/css"> /* Disable user selection to avoid strange bug in Chrome on Windows: * Selecting a text outside the canvas, then clicking+dragging would * drag the selected text but block mouse down/up events to the engine. */ body { position: fixed; /* Prevent overscroll */ margin:0; padding:0; } .canvas-app-container { width: 100%; height: 100%; position: absolute; align-items: center; justify-content: center; overflow: hidden; } .canvas-app-container:-webkit-full-screen { /* Auto width and height in Safari/Chrome fullscreen. */ width: auto; height: auto; } #canvas { outline: none; border: 0; width: 100%; vertical-align: bottom; } #canvas-container { position: relative; } canvas:focus, canvas:active { outline: none; border: 0; ie-dummy: expression(this.hideFocus=true); -moz-outline-style: none; } div { -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } .link, .button { font-family: sans-serif; font-size: 14px; font-weight: normal; font-style: normal; font-stretch: normal; line-height: normal; letter-spacing: 0px; padding-top: 12px; } .buttons-background { background-color: #1e2226; width: 100%; height: 42px; } .canvas-app-canvas { background-repeat:no-repeat; background-position: center center; /* Center and scale the image nicely */ background-repeat: no-repeat; background-size: cover; z-index: 1 } /* Common styles for overlay and images */ .image-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; /* Ensure this is above the canvas z-index */ } @keyframes rotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } 100% { transform: rotate(0deg); } } @keyframes moveUpDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1vh); } } @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } } @keyframes logoAnimation { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 10% { transform: translateY(-0.5vh) scale(1.02) rotate(-2deg); } 20%, 80% { transform: translateY(-1vh) scale(1.05) rotate(3deg); } 30%, 50%, 70% { transform: translateY(-0.5vh) scale(1.02) rotate(-2deg); } 40%, 60% { transform: translateY(-0.75vh) scale(1.03) rotate(2deg); } } /* Specific image overrides for WebP support */ .no-webp .overlay-image.first-image { background-image: url("loading.jpg"); } .webp .overlay-image.first-image { background-image: url("loading.webp"); } .overlay-image.second-image { background-image: url("cow.png"); } .overlay-image.logo-image { background-image: url("title.png"); } .overlay-image.first-image { background-repeat:no-repeat; background-position: center center; background-size: cover; width: 100%; height: 100%; z-index: 3; position: absolute; } .overlay-image.second-image { background-repeat:no-repeat; background-position: center center; background-size: cover; z-index: 4; position: absolute; } .overlay-image.logo-image { background-repeat:no-repeat; background-position: center center; background-size: cover; z-index: 6; position: absolute; animation: logoAnimation 8s infinite alternate ease-in-out; transform-origin: center; } </style> </head> <body> <div id="app-container" class="canvas-app-container"> <div id="webgl-not-supported" style="display: none; margin: 3em;"> <h1>WebGL not supported ⚠️</h1> <p>WebGL is not supported by your browser - visit <a>https://get.webgl.org/</a> to earn more.</p> </div> <div id="canvas-container" class="canvas-app-canvas-container"> <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="960" height="540"></canvas> <div id="image-overlay" class="image-overlay"><!-- Images are loaded via CSS background-image --> <div class="overlay-image first-image"></div> <div class="overlay-image second-image"></div> <div class="overlay-image logo-image"></div> </div> </div> <div class="buttons-background"> </div> <!-- center and anchor to bottom of page --> <div id="progress-bar-root" style="position: absolute; left: 50%; visibility: hidden; z-index: 8;"><img id="progress-bar-bg" src="load_bar_bg.png"> <img src="load_bar_fg.png" id="progress-bar-fg" style="position:absolute; clip: rect(0px,0px,0px,0px);"> <div id="progress-bar-text" style="color: #FFFFFF ;text-align: center; vertical-align:bottom; margin-left: -100%; font-weight: bold; font-family:Verdana-Bold,Verdana,serif; font-size:10px;"></div> </div> </div> </body>
