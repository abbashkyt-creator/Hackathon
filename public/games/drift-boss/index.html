<!DOCTYPE html>
<html> <head> <title>Drift Boss</title> <link rel="icon" type="image/x-icon" href="media/graphics/misc/favicon.ico" /> <meta name="viewport" content="initial-scale=1.0001, minimum-scale=1.0001, maximum-scale=1.0001, user-scalable=no, minimal-ui" /> <meta name="apple-mobile-web-app-capable" content="yes" /> <link rel="stylesheet" type="text/css" href="game.css"> <!-- Tip Tap local mirror: real Drift Boss bundle (poki gdn), SDK-replaced --> <style> html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; } #ajaxbar { width: 100%; height: 100%; } #game, #webgl { width: 100%; height: 100%; } canvas { display: block; } /* letterbox the 720x1280 portrait game into the phone frame */ #game canvas, #webgl canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100%; } #orientate { display: none !important; } #play { position: absolute; inset: 0; z-index: 10; cursor: pointer; background: #000; } #play img { width: 100%; height: 100%; object-fit: contain; } #play.playing { display: none; } </style> <!-- Local PokiSDK shim: fail-closed, ad-free. The game self-injects the real poki-sdk.js if #poki-jssdk is absent; providing a local script element with the same id prevents that external fetch (network-lock keeps it off). --> <!-- Tip Tap platform bridge: score reporting + auto-start on first load --> <!-- network lock: block any external fetch after boot (fail-closed) --> </head> <body onload="setTimeout(function(){window.scrollTo(0,1)},1);"> <div id="ajaxbar"> <div id="game"><canvas id="canvas"></canvas></div> <div id="webgl"><canvas id="webglcanvas"></canvas></div> <div id="orientate"></div> <div id="play" class="play" onclick=""><img src="media/graphics/splash/mobile/cover-start.jpg" /></div> <!-- ad placeholders from the original build: kept as inert divs (no ad SDK) --> <div id="MobileAdInGamePreroll"><div id="MobileAdInGamePreroll-Box"> <div id="MobileAdInGamePreroll-Box-Header"></div> <a id="MobileAdInGamePreroll-Box-Close" onclick="MobileAdInGamePreroll.Close();"></a> <div id="MobileAdInGamePreroll-Box-Body"><center></center></div> <div id="MobileAdInGamePreroll-Box-Footer"></div> </div></div> <div id="MobileAdInGameEnd"><div id="MobileAdInGameEnd-Box"> <div id="MobileAdInGameEnd-Box-Header"></div> <a id="MobileAdInGameEnd-Box-Close" onclick="MobileAdInGameEnd.Close();"></a> <div id="MobileAdInGameEnd-Box-Body"><center></center></div> <div id="MobileAdInGameEnd-Box-Footer"></div> </div></div> </div>
</body> </html>
