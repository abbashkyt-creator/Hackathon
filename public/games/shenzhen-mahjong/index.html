<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><meta http-equiv="X-UA-Compatible" content="ie=edge"/><meta name="theme-color" content="#000000"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="application-name" content=""/><meta name="apple-mobile-web-app-title" content=""/><meta name="msapplication-starturl" content="./"/><script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script><title>Shenzhen Mahjong</title><style>.loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #008fff;
            transition: opacity 0.75s, visibility 0.75s;
        }

        .loader--hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader::after {
            content: "";
            width: 75px;
            height: 75px;
            border: 15px solid #dddddd;
            border-top-color: #009578;
            border-radius: 50%;
            animation: loading 0.75s ease infinite;
        }

        @keyframes loading {
            from {
                transform: rotate(0turn);
            }
            to {
                transform: rotate(1turn);
            }
        }

        html,
        body {

            background-color: #008fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }
        #game-container {
            width: 100%;
            height: 100%;

            /* ✅ Тут фон саме як background, не як <img> */
            background-image: url('assets/bg/bg0.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;


            position: relative;
        }</style><noscript>Please enable javascript to continue using this application.</noscript><script>window.removedLoader = false;
        window.dontUseIt = false;
        window.rewarded = false;


        document.addEventListener('visibilitychange', () => {
            console.warn('vis changed');
            if(!window.dontUseIt){
                if (document.hidden && window.compl && window.compl.sounds) {
                    window.compl.sounds.disable();
                } else {
                    if(window.compl && window.compl.sounds)
                        window.compl.sounds.enable();
                }
            }
        })
        window.onload = function() {
            const loader = document.querySelector(".loader");

            loader.classList.add("loader--hidden");

            loader.addEventListener("transitionend", () => {

                if(window.removedLoader === false)
                    document.body.removeChild(loader);

                window.removedLoader = true;

            });
        }




        window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });


        window.removedLoader = false;
        window.dontUseIt = false;
        window.rewarded = false;
        window.reward = false;
        window.beforeAdsInited = true;
        window.noads = false;
        window.no_ad = false;




        window.firstStart = false;

        window.addEventListener('keydown', ev => {
            if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
                ev.preventDefault();
            }
        });
        window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });


        window.reward = false;
        window.errorCounter = 0;

        window.compl = null;
        window.adType = 'none';
        window.wasAds  = false;</script><script defer="defer" src="./bundle.min.js"></script></head><body><div id="game-container"></div><div class="loader"></div></body></html>
