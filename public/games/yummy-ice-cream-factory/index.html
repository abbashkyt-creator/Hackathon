<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Yummy Ice Cream Factory</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	
	<script src="//game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>	
	<script type="text/javascript" src="./yummy_ice_cream_factory.js"></script>
	
	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		@font-face {
			font-family: 'Bombardier';
			src: url('fonts/bombardier.eot?#iefix') format('embedded-opentype'),
			url('fonts/bombardier.woff') format('woff'),
			url('fonts/bombardier.ttf') format('truetype'),
			url('fonts/bombardier.svg#Bombardier') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Fredoka One';
			src: url('fonts/FredokaOne-Regular.eot?#iefix') format('embedded-opentype'),
			url('fonts/FredokaOne-Regular.woff') format('woff'),
			url('fonts/FredokaOne-Regular.ttf') format('truetype'),
			url('fonts/FredokaOne-Regular.svg#Fredoka%20One') format('svg');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		pauseGame  = function(){};
		resumeGame = function(){};
		isAdsBlock = false;

		PokiSDK.init().then(
			() => {
				lime.embed ("yummy_ice_cream_factory", "openfl-content", 0, 0, { parameters: {} });				
				console.log("PokiSDK initialized");
			}   
		).catch(
			() => {
				lime.embed ("yummy_ice_cream_factory", "openfl-content", 0, 0, { parameters: {} });
				isAdsBlock = true;
				console.log("Adblock enabled");
			}   
		);
		//PokiSDK.setDebug(true); //live disable	
	</script>
</body>
</html>
