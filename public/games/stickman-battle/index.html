<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stickman Battle</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="screen-orientation" content="landscape"/>
  <meta name="x5-orientation" content="landscape"/>
  <meta name="x5-page-mode" content="app"/>
  <link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css"/>
</head>
<body>
  <!-- Tip Tap local mirror injections -->
  <script src="/games/_shared/network-lock.js"></script>
  <script src="/games/_shared/ad-client.js"></script>
  <script src="js/poki-sdk-shim.js"></script>
  <script src="js/tiptap-platform-bridge.js"></script>

  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

  <script src="src/settings.45ee1.js" charset="utf-8"></script>
  <script src="main.213d5.js" charset="utf-8"></script>

  <script type="text/javascript">
(function () {
  var debug = window._CCSettings.debug;
  var splash = document.getElementById('splash');
  splash.style.display = 'block';

  function loadScript (moduleName, cb) {
    function scriptLoaded () {
      document.body.removeChild(domScript);
      domScript.removeEventListener('load', scriptLoaded, false);
      cb && cb();
    }
    var domScript = document.createElement('script');
    domScript.async = true;
    domScript.src = moduleName;
    domScript.addEventListener('load', scriptLoaded, false);
    document.body.appendChild(domScript);
  }

  // Poki gate: wait for the shim's init promise, then boot the engine
  function startEngine() {
    loadScript('cocos2d-js-min.9eb31.js', function () {
      if (typeof CC_PHYSICS_BUILTIN !== 'undefined' && (CC_PHYSICS_BUILTIN || (typeof CC_PHYSICS_CANNON !== 'undefined' && CC_PHYSICS_CANNON))) {
        loadScript('physics-min.js', window.boot);
      } else {
        window.boot();
      }
    });
  }

  if (window.PokiSDK) {
    PokiSDK.init().then(function () { startEngine(); }).catch(function () { startEngine(); });
  } else {
    window.addEventListener('poki-sdk-ready', startEngine);
    setTimeout(startEngine, 2500);
  }
})();
</script>
</body>
</html>
