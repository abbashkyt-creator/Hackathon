<html lang="en"> <head> <meta charset="utf-8" /> <!-- The game is a fixed light design. Declare it so Android Chrome's auto-dark ("Darken websites") never repaints our mix-blend-mode / mask-image / backdrop-filter layers into a darkened composite — that was a source of flicker and vanishing UI on Android. --> <meta name="color-scheme" content="only light" /> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" /> <title>SuperDress</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } html, body { width: 100%; height: 100%; overflow: hidden; background: #f8d8e0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; } .app-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: linear-gradient(180deg, #ffd7e5 0%, #ff9ec9 100%); transition: opacity 0.4s ease; } .app-loader.hide { opacity: 0; pointer-events: none; } .app-loader[hidden] { display: none; } .app-loader-inner { display: flex; flex-direction: column; align-items: center; gap: 26px; } .app-loader-title { font: 900 clamp(40px, 9vw, 72px)/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 2px; color: #ff3a8d; text-shadow: 0 0 2px #fff, 0 4px 12px rgba(196, 12, 76, 0.45); } .app-loader-spin { width: 64px; height: 64px; border-radius: 50%; border: 7px solid rgba(255, 255, 255, 0.6); border-top-color: #ff3a8d; animation: app-loader-spin 0.9s linear infinite; } @keyframes app-loader-spin { to { transform: rotate(360deg); } } </style> </head> <body> <div id="appLoader" class="app-loader"> <div class="app-loader-inner"> <div class="app-loader-title">SuperDress</div> <div class="app-loader-spin"></div> </div> </div> <div id="app"></div> </body>
