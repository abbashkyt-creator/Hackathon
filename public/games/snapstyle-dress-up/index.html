<!doctypehtml><html lang=en-us><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no"name=viewport><title>SnapStyle Dress-up</title><style>body{margin:0;background:linear-gradient(#d6edfb,#a4daf6);height:100vh}.emscripten{position:absolute;top:0;left:0;margin:0;border:0;width:100%;height:100%;overflow:hidden;display:block}.clouds{background-image:url('files/clouds.png');width:100%;height:100%;position:absolute;background-position:bottom;background-repeat:repeat-x;background-size:100%}canvas{outline:0;border:0}@font-face{font-family:Boleh;src:url('files/moderniz.otf')}#loadingContainer{width:100%;height:100%}.progress{width:60%;height:5%;max-height:15%;background-color:#b83660;border-radius:35px;margin-bottom:10px;border:7px solid #b6345e;margin-left:auto;margin-right:auto;position:relative}#progress-bar{height:100%;background-color:#ff92ac;border-radius:100px}.logo{display:block;margin-left:auto;margin-right:auto;margin-top:10vh;z-index:10;position:relative}#loadingText{position:absolute;width:100%;text-align:center;color:#ef3566;font-family:boleh;font-size:2vh;font-weight:900;margin-top:15px}.creditsText{position:absolute;width:100%;text-align:center;color:#ef3566;font-family:boleh;font-size:1vh;font-weight:900;margin-top:15px;bottom:5px}#loadingPercent{position:absolute;width:100%;text-align:center;color:#fff;font-family:boleh;font-size:3vh;font-weight:900;margin-top:1vh;transform:translate(0,-2px);-webkit-text-stroke-width:0.08em;-webkit-text-stroke-color:#ba3863}.photo{width:25%;transform:translate(50%,-20%);z-index:1;position:relative;margin-bottom:-6%}.gelatine{animation:gelatine 1.5s infinite}@keyframes gelatine{from,to{transform:scale(1,1)}25%{transform:scale(.95,1.02)}50%{transform:scale(1.02,.95)}75%{transform:scale(.95,1.02)}}@media only screen and (max-width:800px){.logo{width:70%;height:auto;margin-bottom:6vh;margin-top:30vh}.progress{height:3vh;width:90%;border:1vw solid #b6345e}#loadingPercent{margin-top:0}}@media (max-height:488px) and (orientation:landscape){.logo{width:30%;height:auto;margin-bottom:6vh;margin-top:5%}}</style></head><body><div class=emscripten><div class=clouds></div><div id=loadingContainer><img class="gelatine logo"src=files/logo.png> <img class=photo src=files/photo0.png> <img class=photo src=files/photo1.png> <img class=photo src=files/photo2.png><div class=progress><div id=progress-bar style=width:0%><span id=loadingPercent>0%</span></div></div><span id=loadingText>Loading<span class=dot-one>.</span><span class=dot-two>.</span><span class=dot-three>.</span><br></span></div></div><canvas class=emscripten id=canvas tabindex=-1></canvas></body></html>
