<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dinosaur Game</title>
<script src="/games/_shared/network-lock.js"></script>
<script src="/games/_shared/ad-client.js"></script>
<script src="js/tiptap-platform-bridge.js"></script>
<style>
body {
  background-color: #f7f7f7;
}

header {
  padding-top: 1em;
  text-align: center;
  max-width: 800px;
  margin: auto
}

h1 {
  font-size: 2em;
  font-weight: bold
}

p {
  line-height: 1.75em;
  font-size: 1em
}

#offline-resources {
  display: none
}

.interstitial-wrapper {
  color: #2b2b2b;
  font-size: 1em;
  margin: 0 auto;
  max-width: 600px;
  width: 100%
}

.runner-container {
  direction: ltr;
  height: 150px;
  max-width: 600px;
  overflow: hidden;
  position: absolute;
  top: 50%;
  transform: translate(0, -50%);
  width: 100%;
}

.runner-canvas {
  height: 150px;
  max-width: 600px;
  opacity: 1;
  overflow: hidden;
  position: absolute;
  top: 0;
  z-index: 2
}

.controller {
  background: rgba(247, 247, 247, .1);
  height: 100vh;
  left: 0;
  position: absolute;
  top: 0;
  width: 100vw;
}

</style>
</head>
<body>
<style></style>
<div id="main-frame-error" class="interstitial-wrapper" >
	<img class="icon icon-offline" style="visibility: hidden;">
</div>

<div id="offline-resources" >
    <div id="offline-resources-1x" >
        <img id="1x-obstacle-large" src="img/1x-obstacle-large.png" >
        <img id="1x-obstacle-small" src="img/1x-obstacle-small.png" >
        <img id="1x-cloud" src="img/1x-cloud.png" >
        <img id="1x-text" src="img/1x-text.png" >
        <img id="1x-horizon" src="img/1x-horizon.png" >
        <img id="1x-trex" src="img/1x-trex.png" >
        <img id="1x-restart" src="img/1x-restart.png" >
    </div>
    <div id="offline-resources-2x" >
        <img id="2x-obstacle-large" src="img/2x-obstacle-large.png" >
        <img id="2x-obstacle-small" src="img/2x-obstacle-small.png" >
        <img id="2x-cloud" src="img/2x-cloud.png" >
        <img id="2x-text" src="img/2x-text.png" >
        <img id="2x-horizon" src="img/2x-horizon.png" >
        <img id="2x-trex" src="img/2x-trex.png" >
        <img id="2x-restart" src="img/2x-restart.png" >
    </div>
</div>
<div id="audio-resources" >
	<audio id="offline-sound-press" src="sounds/offline-sound-press.mp3"></audio>
	<audio id="offline-sound-hit" src="sounds/offline-sound-hit.mp3"></audio>
	<audio id="offline-sound-reached" src="sounds/offline-sound-reached.mp3"></audio>
</div>
<!--

Dinosaur Game is a endless runner game originally build into Google Chrome. The game was added to Google Chrome in 2014 to entertain users for when there was no internet available as an easter egg. The game - nicknamed Chrome Dino - featuring a t-rex is played by over 270 million players every month. You can play the Dinosaur Game on <siteName /> in fullscreen, this time also when you are online.

<h3>How to play the Google Chrome Dinosaur Game?</h3>
<p>You start the game by clicking the spacebar on your keyboard, on on mobile tab the dino once. Avoid the obstocles by jumping over them using the spacebar or by tapping.</p>

<h3>Who created the Dinosaur Game?</h3>
<p>The game was created by Edward Jung, Sebastien Gabriel and Alan Bettes all part of the Chrome UX team in 2014.</p>

-->
<script src="js/dino-runner.js"></script>
</body>
</html>
