<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaff" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("ttg_theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#171a30" : "#fbfaff");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="Tip Tap Games: the infinite feed of instant one-thumb games. Play, compete, swipe."
    />
    <meta property="og:title" content="TipTap — Play. Compete. Swipe. Repeat." />
    <meta property="og:description" content="The infinite feed of instant games. Short games, big fun, global competition." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social-card.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Tip Tap Games — Play the feed</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
